robot:
  id: so101
  name: SO-101
  simulator: mujoco
  asset:
    root: assets/robots/so101
    model_xml: so_arm101_description/mjcf/scene.xml
    status: imported_from_ros2_so_arm
  control:
    control_hz: 30
    action_space: common_so101_action
  joints:
    status: names_to_verify_against_asset
    ordered_names:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_flex_joint
      - wrist_flex_joint
      - wrist_roll_joint
      - gripper_joint
  end_effector:
    tcp_site: gripperframe
    status: verify_origin_and_axes_in_mujoco
  units:
    position: m
    angle: rad
    time: s
